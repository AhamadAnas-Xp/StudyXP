kind = "web"
previewPath = "/"
title = "StudyXP"
version = "1.0.0"
id = "artifacts/studyxp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23473

[services.development]
run = "pnpm --filter @workspace/studyxp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studyxp", "run", "build" ]
serve = "static"
publicDir = "artifacts/studyxp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23473"
BASE_PATH = "/"
